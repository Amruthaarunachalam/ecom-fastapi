<!DOCTYPE html>
<html>
    <head>
        <script src="script.js"></script>
    </head>
    <body>
        <form id="AddProducts"  method="POST">
  <div>
    <label for="product_name">Product Name:</label>
    <input type="text" id="product_name" name="product_name" required>
  </div>
  <br>

  <div>
    <label for="category_id">Category ID:</label>
    <input type="number" id="category_id" name="category_id" required>
  </div>
  <br>

  <div>
    <label for="product_description">Product Description:</label><br>
    <textarea id="product_description" name="product_description" rows="4" cols="50"></textarea>
  </div>
  <br>

  <div>
    <label for="product_color">Product Color:</label>
    <input type="text" id="product_color" name="product_color">
  </div>
  <br>

  <div>
    <label for="product_price">Product Price:</label>
    <input type="number" id="product_price" name="product_price" step="0.01" min="0" required>
  </div>
  <br>

  <div>
    <label for="available_stocks">Available Stocks:</label>
    <input type="number" id="available_stocks" name="available_stocks" min="0" required>
  </div>
  <br>

  <div>
    <input type="submit" value="Submit Product">
  </div>
</form>
    </body>
    </html>
